<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="author" content="Thejaswini Srinivasan Manjula" />
    <meta
      name="description"
      content="Contact Thejaswini Srinivasan Manjula — LinkedIn, GitHub, and email, plus a small word game."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="images/logo_ts.png" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Contact — Thejaswini Srinivasan</title>
  </head>
  <body>
    <header class="site-header">
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html" class="nav__brand">thejaswini srinivasan</a>
        <ul class="nav__links">
          <li><a href="index.html" class="nav__link">Home</a></li>
          <li><a href="about.html" class="nav__link">About Me</a></li>
          <li>
            <a href="education.html#education-section" class="nav__link"
              >Education</a
            >
          </li>
          <li>
            <a href="education.html#experience-section" class="nav__link"
              >Experience</a
            >
          </li>
          <li>
            <a href="contact.html" class="nav__link is-active">Contact</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="page contact-page">
        <div class="page__inner contact-grid">
          <div class="contact-info">
            <h1 class="contact-heading">connect<br />with me.</h1>

            <div class="contact-links">
              <a
                class="contact-link"
                href="https://www.linkedin.com/in/thejaswini-srinivasan"
                target="_blank"
                rel="noopener"
              >
                <span class="contact-link__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect
                      x="1"
                      y="1"
                      width="22"
                      height="22"
                      rx="4"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                    />
                    <text
                      x="12"
                      y="16.5"
                      text-anchor="middle"
                      font-family="Arial, sans-serif"
                      font-size="10"
                      font-weight="700"
                      fill="currentColor"
                    >
                      in
                    </text>
                  </svg>
                </span>
                <span>Thejaswini Srinivasan</span>
              </a>

              <a
                class="contact-link"
                href="https://github.com/thejuu5"
                target="_blank"
                rel="noopener"
              >
                <span class="contact-link__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <text
                      x="12"
                      y="16"
                      text-anchor="middle"
                      font-family="ui-monospace, monospace"
                      font-size="12"
                      font-weight="700"
                      fill="currentColor"
                    >
                      &lt;/&gt;
                    </text>
                  </svg>
                </span>
                <span>github.com/thejuu5</span>
              </a>

              <a
                class="contact-link"
                href="mailto:thejaswinisrinivasan5@gmail.com"
              >
                <span class="contact-link__icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24">
                    <rect
                      x="2"
                      y="4"
                      width="20"
                      height="16"
                      rx="2"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                    />
                    <path
                      d="M3 6 L12 13 L21 6"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
                <span>thejaswinisrinivasan5@gmail.com</span>
              </a>
            </div>
          </div>

          <div class="contact-game">
            <h2>while you're here.</h2>
            <p class="word-game-intro">
              I'm a sucker for a good word game — guess mine in 5 tries.
            </p>

            <div class="word-game" id="wordGame">
              <div class="word-game__board" id="wgBoard"></div>
              <p class="word-game__message" id="wgMessage" aria-live="polite">
                &nbsp;
              </p>
              <div class="word-game__keyboard" id="wgKeyboard"></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Thejaswini</p>
    </footer>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/contact.js"></script>
  </body>
</html>
